[project]
name = "hackalem-money-graph"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "networkx==3.7",
  "numpy==2.5.3",
  "pandas==3.0.6",
  "pyarrow==25.0.1",
  "scipy==1.18.1",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["case/starter"]
testpaths = ["tests"]
